[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kodak-helper"
version = "0.1.0"
description = "Toolkit for KODAK CHARMERA & Generalplus-based keychain cameras"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
kodak-helper = "kodak_helper.cli:main"

[tool.setuptools.packages.find]
include = ["kodak_helper*"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
