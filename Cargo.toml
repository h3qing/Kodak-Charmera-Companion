[workspace]
resolver = "2"
members = [
    "crates/charmera-core",
    "crates/charmera-cli",
    "crates/charmera-app",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/h3qing/Kodak-Charmera-Companion"

[workspace.dependencies]
charmera-core = { path = "crates/charmera-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
